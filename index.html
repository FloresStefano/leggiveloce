<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Leggo a Tempo: giochi gratuiti per allenare la lettura dei bambini, a tempo." />
<meta name="theme-color" content="#ff6f59" />
<title>Leggo a Tempo</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<main>

  <!-- SCHERMATA HOME -->
  <section id="schermo-home" class="screen attivo">
    <div class="home__mascotte" aria-hidden="true">📖⏱️</div>
    <h1 class="home__titolo">Leggo a Tempo</h1>
    <p class="home__sottotitolo">Scegli un gioco e allenati a leggere!</p>

    <div id="lista-giochi" class="giochi-lista"></div>
  </section>

  <!-- SCHERMATA GIOCO 1: Leggi bisillabe piane semplici -->
  <section id="schermo-gioco" class="screen">
    <div class="gioco">
      <div class="gioco__header">
        <div id="gioco-titolo" class="gioco__titolo"></div>
        <div id="cronometro" class="cronometro">0.0s</div>
      </div>

      <div class="gioco-area">
        <div id="parole-griglia" class="parole-griglia"></div>

        <div id="countdown-overlay" class="countdown-overlay">
          <span id="countdown-testo" class="countdown-testo">3</span>
        </div>
      </div>

      <div class="gioco__azioni">
        <button id="btn-pausa" class="btn-secondario">⏸️ Pausa</button>
        <button id="btn-ricomincia" class="btn-secondario">🔁 Ricomincia</button>
        <button id="btn-nuova-sfida" class="btn-secondario">🎲 Nuova sfida</button>
        <button id="btn-fine" class="btn-primario btn-fine">✅ FINE</button>
        <button id="btn-esci" class="btn-secondario">🏠 Esci</button>
      </div>
    </div>
  </section>

  <!-- SCHERMATA GIOCO 2: Combina bisillabe -->
  <section id="schermo-abbina" class="screen">
    <div class="gioco">
      <div class="gioco__header">
        <div class="gioco__titolo">🧩 Combina bisillabe</div>
        <div id="abbina-cronometro" class="cronometro">0.0s</div>
      </div>

      <p class="abbina-istruzioni">Tocca una parte a sinistra e la sua metà a destra per formare la parola.</p>

      <div class="abbina-colonne">
        <div id="abbina-sinistra" class="abbina-colonna"></div>
        <div id="abbina-destra" class="abbina-colonna"></div>
      </div>

      <p id="abbina-messaggio" class="abbina-messaggio"></p>

      <div class="gioco__azioni">
        <button id="abbina-btn-ricomincia" class="btn-secondario">🔁 Ricomincia</button>
        <button id="abbina-btn-nuova-sfida" class="btn-secondario">🎲 Nuova sfida</button>
        <button id="abbina-btn-esci" class="btn-secondario">🏠 Esci</button>
      </div>
    </div>
  </section>

  <!-- SCHERMATA RISULTATI -->
  <section id="schermo-risultati" class="screen">
    <div class="risultati">
      <h2 class="risultati__titolo">Tempo finale</h2>
      <div id="risultati-tempo" class="risultati__tempo">0.0s</div>
      <p id="risultati-messaggio" class="risultati__messaggio"></p>

      <div class="salva-record">
        <label class="salva-record__label" for="nome-input">Chi ha giocato?</label>
        <input id="nome-input" class="salva-record__input" type="text" placeholder="Scrivi il tuo nome" maxlength="30" />
        <div id="nome-chips" class="chips"></div>
        <div class="salva-record__azioni">
          <button id="btn-salva-record" class="btn-primario">💾 Salva record</button>
          <button id="btn-non-salvare" class="btn-secondario">🚫 Non salvare</button>
        </div>
        <p id="salva-conferma" class="salva-conferma"></p>
      </div>

      <div class="risultati__azioni">
        <button id="btn-riprova" class="btn-secondario">🔁 Ricomincia</button>
        <button id="btn-nuove-parole" class="btn-secondario">🎲 Nuova sfida</button>
        <button id="btn-risultati-esci" class="btn-secondario">🏠 Torna alla home</button>
      </div>
    </div>
  </section>

</main>

<script src="js/games/bisillabe-piane-semplici.js"></script>
<script src="js/games/trisillabe-piane.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
